name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 10 */5 * *'     # every 5 days at 10:00 UTC
  workflow_dispatch:           # also triggerable manually

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/profile?select=name&limit=1" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}")
          echo "Supabase responded with HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then exit 1; fi